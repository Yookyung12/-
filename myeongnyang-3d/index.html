  <style>
    :root {
      color-scheme: dark;
      --sea: #071523;
      --panel: #0d2032;
      --line: #24445b;
      --text: #edf5f6;
      --muted: #9db3c0;
      --teal: #28c7b7;
      --gold: #e3bf68;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--sea); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; background: var(--sea); }
    #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: auto; padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); background: var(--sea); }
    #loading[hidden], [hidden] { display: none !important; }
    .loading-card { width: min(100%, 620px); padding: clamp(24px, 5vw, 48px); text-align: center; border: 1px solid var(--line); border-top: 3px solid var(--teal); border-radius: 18px; background: var(--panel); box-shadow: 0 24px 80px #0005; }
    #game-icon { display: block; width: 72px; height: 72px; margin: 0 auto 18px; border: 1px solid #28c7b755; border-radius: 18px; }
    .eyebrow { margin: 0 0 10px; color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0; color: var(--text); font-size: clamp(24px, 6vw, 36px); line-height: 1.2; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .subtitle { margin: 10px 0 26px; color: var(--muted); font-size: 15px; }
    .progress-shell { width: min(100%, 390px); margin: 0 auto; }
    #loading-progress { width: 100%; height: 10px; overflow: hidden; border: 1px solid #ffffff1d; border-radius: 99px; background: #06121e; }
    #loading-progress > span { display: block; width: 35%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #179d95, var(--teal)); transition: width .2s ease-out; }
    #loading-progress[data-indeterminate="true"] > span { animation: tide-sweep 1.8s ease-in-out infinite; }
    #loading-status { min-height: 24px; margin: 14px 0 0; color: var(--text); font-size: 14px; font-weight: 600; }
    #loading-notice { max-width: 420px; margin: 12px auto 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    #loading-retry { min-height: 44px; margin-top: 18px; padding: 0 24px; border: 1px solid var(--teal); border-radius: 10px; background: #0a766f; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    #loading-retry:hover { background: #0b8c83; }
    #loading-retry:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .history-note { margin: 28px 0 0; color: #8098a7; font-size: 12px; line-height: 1.6; }
    @keyframes tide-sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
    @media (max-width: 520px) { .loading-card { padding: 26px 20px; border-radius: 14px; } #game-icon { width: 62px; height: 62px; } .subtitle { font-size: 14px; } }
    @media (max-height: 520px) and (min-width: 620px) { #loading { place-items: center end; } .loading-card { width: min(52vw, 540px); padding: 18px 28px; } #game-icon { width: 48px; height: 48px; margin-bottom: 10px; } .subtitle { margin-bottom: 14px; } .history-note { margin-top: 14px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>

      <p class="eyebrow">울돌목 · 지구시스템과학 작전 시뮬레이션</p>
      <h1>명량해전: 13척의 선택</h1>
      <p class="subtitle">바다를 읽는 작전참모</p>
      <div class="progress-shell">
        <div id="loading-progress" role="progressbar" aria-label="게임 로딩 진행률" aria-valuemin="0" aria-valuemax="100" data-indeterminate="true"><span></span></div>
        <p id="loading-status">게임 자료를 불러오는 중…</p>
      </div>
      <p id="loading-notice" hidden></p>
      <button id="loading-retry" type="button" hidden>다시 시도</button>
      <p class="history-note">역사적 명량해전과 플레이어의 교육용 가상 작전·결과를 구분합니다.</p>
      <noscript>게임을 실행하려면 JavaScript를 켜 주세요.</noscript>
    </div>

  <script>
    (() => {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7715524,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      const threads = false;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const progressFill = progress.firstElementChild;
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let failed = false;
      let ready = false;
      document.title = '명량해전: 13척의 선택';
      retry.addEventListener('click', () => window.location.reload());

      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        notice.textContent = performance.now() - lastProgressAt >= 30000
          ? '로딩 진행이 잠시 멈춰 있습니다. 네트워크에 따라 더 기다릴 수 있으며, 원하면 다시 시도할 수 있습니다.'
          : '게임을 불러오고 있습니다. 계속 기다리거나 다시 시도할 수 있습니다.';
      };
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] 게임 시작 실패', error);
        loading.hidden = false;
        status.textContent = '게임을 불러오지 못했습니다.';
        notice.textContent = '네트워크 연결을 확인한 뒤 다시 시도해 주세요.';
        notice.hidden = false;
        progress.hidden = true;
        retry.hidden = false;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);

      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.dataset.indeterminate = 'true';
          progress.removeAttribute('aria-valuenow');
          progress.setAttribute('aria-valuetext', '로딩 중');
          status.textContent = '게임 자료를 불러오는 중…';
          updateNotice();
          return;
        }
        const percent = Math.min(100, Math.floor(current / total * 100));
        progress.dataset.indeterminate = 'false';
        progress.setAttribute('aria-valuenow', String(percent));
        progress.setAttribute('aria-valuetext', `${percent}% 완료`);
        progressFill.style.width = `${percent}%`;
        status.textContent = current >= total ? '게임을 시작하는 중…' : `${percent}% 불러옴`;
        updateNotice();
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = 'index.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
